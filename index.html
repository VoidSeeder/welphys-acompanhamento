<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acompanhamento do WelPhys</title>
<meta name="description" content="Últimos commits e notas do desenvolvimento do WelPhys.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --fundo: #f6f5f1;
    --cartao: #ffffff;
    --texto: #1f2328;
    --suave: #646b76;
    --linha: #e3e1da;
    --codigo-cor: #1d5a8a;
    --codigo-fundo: #e2eff9;
    --nota-cor: #7a4b12;
    --nota-fundo: #fbefdc;
    --novo: #fff6cf;
    --aviso-cor: #8a3b12;
    --aviso-fundo: #fdeee4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #15171a;
      --cartao: #1e2125;
      --texto: #e8e6e1;
      --suave: #9aa1ab;
      --linha: #2e3238;
      --codigo-cor: #9ccbf0;
      --codigo-fundo: #1b3346;
      --nota-cor: #f0c486;
      --nota-fundo: #3b2c16;
      --novo: #3a3418;
      --aviso-cor: #f3b594;
      --aviso-fundo: #3a2318;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.7rem;
    line-height: 1.2;
    text-wrap: balance;
  }
  .subtitulo {
    margin: 0 0 20px;
    color: var(--suave);
    text-wrap: pretty;
  }
  .situacao {
    margin: 0 0 8px;
    color: var(--suave);
    font-size: 0.9rem;
  }
  .aviso {
    margin: 0 0 16px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--aviso-fundo);
    color: var(--aviso-cor);
    font-size: 0.95rem;
  }
  h2 {
    margin: 28px 0 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--suave);
  }
  h2::first-letter { text-transform: uppercase; }
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
    background: var(--cartao);
    border: 1px solid var(--linha);
    border-radius: 14px;
    overflow: hidden;
  }
  li.item {
    padding: 14px 16px;
    border-top: 1px solid var(--linha);
    transition: background-color 4s ease-out;
  }
  li.item:first-child { border-top: 0; }
  li.item.novo { background: var(--novo); transition: none; }
  .mensagem {
    margin: 0 0 6px;
    overflow-wrap: anywhere;
  }
  .rodape {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    color: var(--suave);
    font-size: 0.88rem;
  }
  .etiqueta {
    padding: 1px 9px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .etiqueta.commit { color: var(--codigo-cor); background: var(--codigo-fundo); }
  .etiqueta.nota { color: var(--nota-cor); background: var(--nota-fundo); }
  .vazio { color: var(--suave); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    li.item { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Acompanhamento do WelPhys</h1>
  <p class="subtitulo">Últimos commits e notas do desenvolvimento, do mais recente para o mais antigo.</p>
  <p class="situacao" id="situacao" aria-live="polite">Carregando…</p>
  <p class="aviso" id="aviso" role="status" hidden></p>
  <div id="lista"></div>
</main>

<script src="lista.js"></script>
<script>
(function () {
  'use strict';

  var GIST_URL = '';
  var INTERVALO_MS = 60 * 1000;
  var MINIMO_ENTRE_CONSULTAS_MS = 15 * 1000;
  var TEMPO_LIMITE_MS = 20 * 1000;
  var CHAVE_SALVA = 'welphys-lista';
  var ROTULOS = { commit: 'Código', nota: 'Nota' };

  var elLista = document.getElementById('lista');
  var elSituacao = document.getElementById('situacao');
  var elAviso = document.getElementById('aviso');
  var fmtHora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });

  var itensAtuais = null;
  var obtidoEm = null;
  var vistos = null;
  var ultimaConsulta = 0;
  var consultando = false;

  function hora(data) {
    return fmtHora.format(data).replace(':', 'h');
  }

  function quando(data, agora) {
    return Lista.nomeDoDia(data, agora).toLowerCase() + ' às ' + hora(data);
  }

  function criarItem(item, novos) {
    var li = document.createElement('li');
    li.className = 'item' + (novos.has(item.id) ? ' novo' : '');

    var mensagem = document.createElement('p');
    mensagem.className = 'mensagem';
    mensagem.textContent = item.texto;

    var rodape = document.createElement('div');
    rodape.className = 'rodape';
    var etiqueta = document.createElement('span');
    etiqueta.className = 'etiqueta ' + item.tipo;
    etiqueta.textContent = ROTULOS[item.tipo];
    var momento = document.createElement('time');
    momento.dateTime = item.data.toISOString();
    momento.textContent = 'às ' + hora(item.data);
    rodape.appendChild(etiqueta);
    rodape.appendChild(momento);

    li.appendChild(mensagem);
    li.appendChild(rodape);
    return li;
  }

  function desenhar(novos) {
    var fragmento = document.createDocumentFragment();
    if (itensAtuais.length === 0) {
      var vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = 'Nenhum registro ainda.';
      fragmento.appendChild(vazio);
    }
    Lista.agruparPorDia(itensAtuais, new Date()).forEach(function (grupo) {
      var titulo = document.createElement('h2');
      titulo.textContent = grupo.titulo;
      var ol = document.createElement('ol');
      grupo.itens.forEach(function (item) { ol.appendChild(criarItem(item, novos)); });
      fragmento.appendChild(titulo);
      fragmento.appendChild(ol);
    });
    elLista.replaceChildren(fragmento);

    // Tira o destaque no quadro seguinte para a cor desbotar aos poucos.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        elLista.querySelectorAll('.novo').forEach(function (el) { el.classList.remove('novo'); });
      });
    });
  }

  function mostrarSituacao() {
    elSituacao.textContent = obtidoEm
      ? 'Atualizado ' + quando(obtidoEm, new Date()) + '. Esta página se atualiza sozinha.'
      : '';
  }

  function salvar(json) {
    try {
      localStorage.setItem(CHAVE_SALVA, JSON.stringify({ registros: json, obtidoEm: obtidoEm.toISOString() }));
    } catch (erro) {
      // Sem localStorage (ou cheio): a página segue funcionando, só não guarda a última lista.
    }
  }

  function carregarSalvo() {
    try {
      var salvo = JSON.parse(localStorage.getItem(CHAVE_SALVA));
      var data = new Date(salvo.obtidoEm);
      if (isNaN(data)) return;
      itensAtuais = Lista.lerRegistros(salvo.registros);
      obtidoEm = data;
      desenhar(new Set());
      mostrarSituacao();
    } catch (erro) {
      // Nada salvo ou conteúdo antigo: a página abre como numa primeira visita.
    }
  }

  function buscar() {
    if (!GIST_URL) return Promise.reject(new Error('Feed não configurado.'));
    var controle = new AbortController();
    var limite = setTimeout(function () { controle.abort(); }, TEMPO_LIMITE_MS);
    return fetch(GIST_URL + '?t=' + Date.now(), { cache: 'no-store', signal: controle.signal })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        return resposta.json();
      })
      .finally(function () { clearTimeout(limite); });
  }

  function atualizar() {
    if (consultando || Date.now() - ultimaConsulta < MINIMO_ENTRE_CONSULTAS_MS) return;
    consultando = true;
    ultimaConsulta = Date.now();

    buscar().then(function (json) {
      var itens = Lista.lerRegistros(json);
      var novos = Lista.idsNovos(vistos, itens);
      vistos = new Set(itens.map(function (item) { return item.id; }));
      itensAtuais = itens;
      obtidoEm = new Date();
      desenhar(novos);
      mostrarSituacao();
      elAviso.hidden = true;
      salvar(json);
    }).catch(function () {
      if (itensAtuais) {
        elAviso.textContent = 'O GitHub não respondeu agora. A lista abaixo é a de ' +
          quando(obtidoEm, new Date()) + ' e a página tenta de novo em instantes.';
      } else {
        elSituacao.textContent = '';
        elAviso.textContent = 'Não foi possível carregar os registros agora. A página tenta de novo em instantes.';
      }
      elAviso.hidden = false;
    }).finally(function () {
      consultando = false;
    });
  }

  carregarSalvo();
  atualizar();
  setInterval(atualizar, INTERVALO_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) atualizar();
  });
})();
</script>
</body>
</html>
